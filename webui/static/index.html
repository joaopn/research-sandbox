<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- interactive-widget=resizes-content: Chromium-only — the soft keyboard
         shrinks the layout viewport so the bottom nav / terminal stay visible.
         iOS ignores it; the --vvh visualViewport fallback in app.js covers it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Research Sandbox</title>
    <!-- CSP is a computed response header now (index_handler): frame-src must
         name the request's own host for the per-editor origin ports, which a
         static meta can't express — and header+meta would intersect. -->
    <link rel="stylesheet" href="/static/vendor/xterm.css">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div id="app"></div>
    <script src="/static/vendor/xterm.js"></script>
    <script src="/static/vendor/xterm-addon-fit.js"></script>
    <script src="/static/vendor/xterm-addon-web-links.js"></script>
    <script src="/static/vendor/xterm-addon-webgl.js"></script>
    <script src="/static/vendor/xterm-addon-search.js"></script>
    <script src="/static/app.js"></script>
</body>
</html>

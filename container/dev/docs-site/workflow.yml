name: docs

on:
  push:
    branches: ["@@BRANCH@@"]
    paths: ["docs/**", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Pages
        uses: actions/configure-pages@v6
      - name: Build the site
        uses: @@JEKYLL_BUILD_PAGES_ACTION@@
        with:
          source: docs
          destination: _site
      - name: Check links
        run: |
          python3 - _site docs/_config.yml <<'LINKCHECK'
          @@LINKCHECK_PY@@
          LINKCHECK
      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

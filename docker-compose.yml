services:
  router:
    build: ./router
    container_name: rs-router
    networks:
      - rs-sandbox
    cap_add:
      - NET_ADMIN
      - NET_RAW
    sysctls:
      - net.ipv4.ip_forward=1
    volumes:
      - rs-router-rules:/etc/sandbox/rules
    extra_hosts:
      # Lets the router resolve host.docker.internal so external MCPs
      # registered with `research mcp add --kind external` can be reached
      # from project subnets via per-project FORWARD ACCEPT rules.
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  webui:
    # Optional browser UI; opt-in via `research webui start` (which does
    # `docker compose --profile webui up -d webui`). Lives on rs-sandbox
    # and is `docker network connect`'d to every rs-net-<project> by
    # `wire_webui_to_projects()` so it can SSH to each supervisor by
    # container DNS without going through the host's published port.
    profiles: ["webui"]
    build: ./webui
    image: rs-webui:latest
    container_name: rs-webui
    # Run as the operator's uid (set by `research webui start`) so the webui can
    # connect to the broker's 0600 socket and pass its SO_PEERCRED check — the
    # uid-equality contract, value-agnostic (defaults to the baked 1000).
    user: "${WEBUI_UID:-1000}:${WEBUI_GID:-1000}"
    networks:
      - rs-sandbox
    ports:
      # WEBUI_PORT is the *host* port; container always listens on 7777
      # internally (matches EXPOSE in webui/Dockerfile). Only WEBUI_BIND
      # crosses the boundary because the TLS cert SAN needs to cover it.
      - "${WEBUI_BIND:-127.0.0.1}:${WEBUI_PORT:-7777}:7777"
      # Per-editor browser-origin range: one listener per port inside the
      # container, one isolated browser-storage origin per in-project HTTP
      # surface. Published as a static contiguous range — `research webui
      # start` pre-probes it and fails loudly on any busy port (no gappy
      # publish). Docker holds the whole range for the container's lifetime.
      - "${WEBUI_BIND:-127.0.0.1}:${WEBUI_ORIGIN_PORT_LO:-10100}-${WEBUI_ORIGIN_PORT_HI:-10164}:${WEBUI_ORIGIN_PORT_LO:-10100}-${WEBUI_ORIGIN_PORT_HI:-10164}"
      # Pass-through block (STAGE_PASSTHROUGH_PORTS): raw-TCP forwarded — no
      # TLS termination, numbers preserved — into whichever project claimed
      # each port (encrypted/multi-port apps the page-relay tab can't front).
      # Same static 1:1 range shape as the origin range above; `research webui
      # start` pre-probes it and refuses overlap with WEBUI_PORT / the origin
      # range. NOT behind the webui login by design (raw TLS can't carry a
      # session cookie) — the app's own auth is the gate.
      - "${WEBUI_BIND:-127.0.0.1}:${WEBUI_PASSTHROUGH_PORT_LO:-10200}-${WEBUI_PASSTHROUGH_PORT_HI:-10299}:${WEBUI_PASSTHROUGH_PORT_LO:-10200}-${WEBUI_PASSTHROUGH_PORT_HI:-10299}"
    environment:
      - WEBUI_BIND=${WEBUI_BIND:-127.0.0.1}
      - WEBUI_ORIGIN_PORT_LO=${WEBUI_ORIGIN_PORT_LO:-10100}
      - WEBUI_ORIGIN_PORT_HI=${WEBUI_ORIGIN_PORT_HI:-10164}
      - WEBUI_PASSTHROUGH_PORT_LO=${WEBUI_PASSTHROUGH_PORT_LO:-10200}
      - WEBUI_PASSTHROUGH_PORT_HI=${WEBUI_PASSTHROUGH_PORT_HI:-10299}
      - RS_PROJECTS_ROOT=/projects
      - RS_BROKER_SOCKET=/run/rs-broker/broker.sock
    volumes:
      - rs-webui-tls:/app/tls
      # Persisted (project, service) → origin-port map, so each editor keeps
      # a stable origin (and thus stable browser state) across webui
      # restarts. Webui-writable; distinct from the cert-only TLS volume.
      - rs-webui-state:/app/state
      # RO read-side onto the same host directory `research project create`
      # writes to. Enables the rail's per-project status sub-line (worker
      # counts, disk, last activity) without granting docker socket access
      # or running a sidecar. Filesystem is the only data plane.
      - ${PROJECTS_DIR:-./container_volumes}:/projects:ro
      # Broker control socket (opt-in management lifecycle). RO mount of ONLY
      # the broker's socket subdir — not all of ~/.research-sandbox, so the
      # password hash / registries stay off the network-facing container. The
      # parent-dir (not socket-file) mount survives the daemon recreating the
      # socket. Broker off ⇒ the dir is empty/absent and management is inert.
      - ${RS_BROKER_DIR:-${HOME}/.research-sandbox/run}:/run/rs-broker:ro
    restart: unless-stopped


volumes:
  rs-router-rules:
  # Pin the literal volume name (no compose project-name prefix), so
  # `research webui cert-tailscale` and similar host-side helpers that
  # write into this volume by name agree with what rs-webui actually
  # mounts. Without `name:`, compose uses `<project>_rs-webui-tls`
  # which silently diverges from the helper's target.
  rs-webui-tls:
    name: rs-webui-tls
  # Same literal-name pinning as rs-webui-tls: the ownership helper in
  # research.py chowns this volume by name pre-start on uid≠1000 hosts.
  rs-webui-state:
    name: rs-webui-state

networks:
  # Shared infrastructure network: has internet via Docker gateway.
  # Per-project networks (rs-net-<name>) are created by research.py as
  # --internal and routed through rs-router.
  rs-sandbox:
    name: rs-sandbox
    driver: bridge

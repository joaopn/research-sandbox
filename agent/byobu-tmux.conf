# Byobu's per-user tmux config: byobu starts tmux with its own profile, which
# sources ~/.byobu/.tmux.conf last and never reads ~/.tmux.conf. byobu-janitor
# only creates this file when it is missing, so the baked copy is kept.
#
# Extended keys: with tmux's default (off) Shift+Enter reaches a program as a
# plain Enter, so Claude Code and pi submit a half-typed prompt instead of
# inserting a newline. `on` forwards modified keys only to programs that ask
# for them (Claude Code and pi do); a plain shell is unaffected. csi-u is the
# format pi asks for (tmux 3.5+, which every image ships).
#
# A killed program can leave its pane in extended mode (Ctrl+C then reaches the
# shell as an escape sequence); agent/bash-tmux-keys.sh clears it at every prompt.
#
# Baked into ~/.byobu/.tmux.conf by Dockerfile.minimal-base, Dockerfile.ext-base
# and Dockerfile.analysis-base. Image-level change: picking it up needs a
# rebuild plus a recreate of the container; a project's boxes move to the
# rebuilt box image at the project's next start.
set -g extended-keys on
set -g extended-keys-format csi-u
